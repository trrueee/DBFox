<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">DBFox 系统架构</title>
  <desc id="desc">用户通过 React 工作区使用 DBFox。Tauri Rust Host 管理桌面运行时和 Python Sidecar。Sidecar 访问本地 SQLite、用户数据源和模型服务。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#eef7f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 14px Inter, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .label { font: 650 17px Inter, "Microsoft YaHei", sans-serif; fill: #172033; }
      .detail { font: 400 13px Inter, "Microsoft YaHei", sans-serif; fill: #526178; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .edgeBoth { fill: none; stroke: #64748b; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edgeLabel { font: 600 12px Inter, "Microsoft YaHei", sans-serif; fill: #526178; }
    </style>
  </defs>

  <rect width="1120" height="500" rx="18" fill="url(#bg)"/>
  <text x="48" y="54" class="title">DBFox 系统架构</text>
  <text x="48" y="80" class="subtitle">桌面运行时、业务引擎和数据边界各有唯一责任主体</text>

  <rect x="48" y="184" width="120" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="108" y="218" text-anchor="middle" class="label">用户</text>
  <text x="108" y="242" text-anchor="middle" class="detail">桌面操作</text>

  <rect x="232" y="154" width="190" height="144" rx="14" fill="#ffffff" stroke="#a99df2" stroke-width="2"/>
  <text x="327" y="194" text-anchor="middle" class="label">React 工作区</text>
  <text x="327" y="222" text-anchor="middle" class="detail">界面与用户交互</text>
  <text x="327" y="246" text-anchor="middle" class="detail">查询缓存与状态投影</text>
  <text x="327" y="270" text-anchor="middle" class="detail">不拥有运行时事实</text>

  <rect x="486" y="132" width="220" height="188" rx="14" fill="#f3f0ff" stroke="#6554d9" stroke-width="2"/>
  <text x="596" y="174" text-anchor="middle" class="label">Tauri / Rust Host</text>
  <text x="596" y="204" text-anchor="middle" class="detail">窗口与系统能力</text>
  <text x="596" y="228" text-anchor="middle" class="detail">Sidecar 生命周期</text>
  <text x="596" y="252" text-anchor="middle" class="detail">端口 · 令牌 · generation</text>
  <text x="596" y="276" text-anchor="middle" class="detail">桌面运行时唯一权威</text>

  <rect x="770" y="132" width="240" height="188" rx="14" fill="#ecf9f7" stroke="#2a9d8f" stroke-width="2"/>
  <text x="890" y="174" text-anchor="middle" class="label">FastAPI Sidecar</text>
  <text x="890" y="204" text-anchor="middle" class="detail">业务 API 与鉴权</text>
  <text x="890" y="228" text-anchor="middle" class="detail">Agent 与工具运行时</text>
  <text x="890" y="252" text-anchor="middle" class="detail">SQL 安全与结果服务</text>
  <text x="890" y="276" text-anchor="middle" class="detail">持久化与事件</text>

  <path d="M168 226 H222" class="edge"/>
  <path d="M422 190 H476" class="edgeBoth"/>
  <path d="M706 226 H760" class="edge"/>
  <path d="M422 258 C550 392, 676 392, 770 280" class="edgeBoth"/>
  <text x="589" y="383" text-anchor="middle" class="edgeLabel">HTTP + SSE · 当前运行时令牌</text>

  <rect x="180" y="410" width="196" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="278" y="438" text-anchor="middle" class="label">本地 SQLite</text>
  <text x="278" y="459" text-anchor="middle" class="detail">会话 · 事件 · 结果索引</text>

  <rect x="462" y="410" width="196" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="438" text-anchor="middle" class="label">用户数据源</text>
  <text x="560" y="459" text-anchor="middle" class="detail">受约束的只读 SQL</text>

  <rect x="744" y="410" width="196" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="842" y="438" text-anchor="middle" class="label">模型服务</text>
  <text x="842" y="459" text-anchor="middle" class="detail">Responses · 工具调用</text>

  <path d="M830 320 C752 357, 548 355, 332 402" class="edgeBoth"/>
  <path d="M870 320 C812 359, 685 377, 588 402" class="edgeBoth"/>
  <path d="M910 320 C912 350, 883 375, 856 402" class="edgeBoth"/>
</svg>
