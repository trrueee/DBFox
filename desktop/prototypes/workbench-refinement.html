<div class="shell">
<aside class="side" aria-label="工作区导航">
  <div class="brand"><svg aria-hidden="true"><use href="#fox"/></svg>DBFox</div>
  <button class="new" id="new-task"><svg aria-hidden="true"><use href="#plus"/></svg>新任务</button>
  <div class="navlabel">工作空间</div>
  <div class="navitem"><svg aria-hidden="true"><use href="#folder"/></svg>Studio</div>
  <div class="navitem active" aria-current="page"><svg aria-hidden="true"><use href="#chat"/></svg>当前任务</div>
  <div class="sidetask" id="side-title"></div>
  <div class="prototype-controls">
    <label for="scene">场景预览</label><select id="scene"><option value="dev">项目开发</option><option value="data">数据分析</option><option value="browser">浏览器工作</option></select>
    <label for="phase">任务状态</label><select id="phase"><option value="complete">已完成</option><option value="approval">需要确认</option><option value="failure">失败与恢复</option></select>

  </div>
</aside>
<main class="main">

</main></div>

<script>
const $=id=>document.getElementById(id);
const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const scenes={
 dev:{title:'修复导出时的空值处理',request:'检查项目里的 CSV 导出逻辑，修复空值导致的错误，并验证结果。',reply:'导出现在会保留空单元格，日期和数字的格式保持一致。修改集中在导出模块，并补上了对应的检查。',process:'已完成 4 项工作 · 18 秒',steps:['阅读导出逻辑与现有约定','修复空值处理','核对日期与数值格式','运行相关检查'],asset:'导出逻辑已更新',assetSub:'2 个文件 · 项目内',files:['src/export/csv.ts','src/export/csv.test.ts'],proof:'3 项检查通过',next:'可以继续检查改动，或告诉我下一步。',failure:'检查未能完成',failureText:'文件修改已保留。测试进程未能启动，当前不能确认检查通过。先查看原因，再决定是否重新运行。',approval:'允许运行相关检查？',approvalText:'将在当前项目目录运行既有测试命令。此操作可能生成本地测试输出。'},
 data:{title:'分析最近一周的订单变化',request:'比较最近一周各渠道的订单情况，整理出需要关注的变化。',reply:'示例数据中，官网渠道的订单增长最明显。以下保留了各渠道的对比，便于检查结论和继续分析。',process:'已完成 3 项工作 · 12 秒',steps:['核对已授权的数据来源','校验并执行只读查询','整理结果与来源'],asset:'渠道订单对比',assetSub:'4 个渠道 · 最近 7 天',proof:'来源可检查',next:'可以查看完整结果，或继续分析某个渠道。',failure:'本次刷新失败',failureText:'仍显示上次成功的结果（10:42）。当前筛选未得到新的数据；可重试读取，已有结果不会被清空。',approval:'确认本次数据访问范围',approvalText:'仅使用当前对话已选择的订单库。此处演示资源范围确认，不授予其他数据库权限。'},
 browser:{title:'填写并保存客户资料',request:'在专属浏览器中填写示例客户资料，保存后检查页面结果。',reply:'资料已保存，后续观察显示页面已确认成功。保存回执和观察画面保留在同一份交付中。',process:'已完成 3 项工作 · 24 秒',steps:['观察已共享的专属浏览器','按已批准动作填写并保存','再次观察保存结果'],asset:'客户资料已保存',assetSub:'操作回执与观察 · 示例',proof:'保存结果已观察',next:'可以查看保存后的证据，或结束这次共享。',failure:'尚不能确认保存结果',failureText:'浏览器操作返回结果未知。请先重新观察页面，确认是否已保存，避免重复提交。',approval:'批准这一次点击？',approvalText:'将在当前观察画面的标记位置单击“保存”。批准仅对应这一个动作。'}
};
let scene='dev',phase='complete',sharing=true,trigger=null,toastTimer;
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function process(s){return `<details class="process"><summary>${icon('chevron')}${s.process}<span class="muted">查看过程</span></summary><div class="steps">${s.steps.map((step,i)=>`<div class="step"><span>${step}</span><time>10:${String(40+i).padStart(2,'0')}</time></div>`).join('')}</div></details>`}
function table(){return `<div class="live-note">${icon('info')}<span>实时重算视图 · 当前查看时间 10:42，不是历史结果快照。</span></div><div class="table-scroll"><table><caption style="position:absolute;width:1px;height:1px;overflow:hidden">最近七天各渠道的示例订单比较</caption><thead><tr><th>渠道</th><th>订单量</th><th>环比</th></tr></thead><tbody><tr><td>官网</td><td>1,284</td><td>+18.6%</td></tr><tr><td>小程序</td><td>906</td><td>+7.2%</td></tr><tr><td>合作渠道</td><td>638</td><td>+3.4%</td></tr><tr><td>其他</td><td>214</td><td>−2.1%</td></tr></tbody></table></div>`}
function delivery(s){return `<section class="deliverable" aria-label="当前成果"><div class="delivery-head"><div class="file-icon">${icon(scene==='browser'?'monitor':'file')}</div><div><h2>${s.asset}</h2><p>${s.assetSub}</p></div></div><div class="delivery-content">${scene==='data'?table():scene==='dev'?s.files.map((f,i)=>`<div class="file-row"><span><code>${f}</code></span><span class="delta">${i?'+24':'＋8 −3'}</span></div>`).join(''):'<p class="small secondary" style="margin:0">示例客户：林先生<br>已保存的观察时间：10:43</p>'}</div><div class="delivery-foot"><span class="proof-line">${icon('check')}${s.proof}</span><button class="link" data-detail>${scene==='data'?'查看来源':'查看证据'}${icon('chevron')}</button></div></section>`}
function share(){return `<div class="share-line"><span>${icon('monitor')} &nbsp;${sharing?'专属浏览器 · 允许控制 · 剩余 12 分钟':'共享已结束 · 后续操作不可用'}</span></div>`}
function approval(s){const fields=scene==='browser'?'<dt>目标</dt><dd>专属浏览器 · 示例客户页面</dd><dt>动作</dt><dd>单击 · 画面位置</dd><dt>落点</dt><dd>距左 84%，距上 76%（示意）</dd><dt>观察</dt><dd>10:42:18 · 当前共享代次</dd>':scene==='dev'?'<dt>目录</dt><dd><code>D:\\Project\\Studio</code></dd><dt>命令</dt><dd><code>npm test -- csv</code></dd>':'<dt>资源</dt><dd>订单库 · 当前对话</dd><dt>范围</dt><dd>只读 · 最近七天订单</dd>';
return `<section class="decision" aria-label="待确认操作"><div class="decision-title">${icon('shield')}<h2>${s.approval}</h2></div><p class="small secondary">${s.approvalText}</p><dl class="facts">${fields}</dl>${scene==='browser'?'<div class="image-demo"><span class="demo-label">示意画面 · 非实际截图</span><div class="demo-window"><strong>客户资料</strong><div class="demo-field">客户姓名 &nbsp; 林先生</div><div class="demo-field">备注 &nbsp; 请于工作日联系</div><div class="demo-button">保存<span class="marker">1</span></div></div></div>':''}<div class="action-row"><button class="primary" id="approve">批准一次</button><button class="quiet" id="reject">拒绝</button></div><p class="safety">原型演示不会执行动作。正式审批必须绑定真实证据与精确输入。</p></section>`}
function render(){const s=scenes[scene];$('scene').value=scene;$('phase').value=phase;$('side-title').textContent=s.title;$('crumb-title').textContent=s.title;$('stop-share').hidden=scene!=='browser'||!sharing;$('status').dataset.phase=phase;$('status').innerHTML=phase==='complete'?icon('check')+'已完成':phase==='approval'?icon('shield')+'等待你的确认':icon('info')+'需要处理';
let body=`<header class="request"><div class="eyebrow">当前任务</div><h1 id="task-title" tabindex="-1">${s.title}</h1><p>${s.request}</p></header>${phase==='approval'?'':`<div class="agent"><span class="spark">${icon('spark')}</span>DBFox</div>`}`;
if(phase==='complete'){body+=`<div class="reply"><p>${s.reply}</p></div>${process(s)}${delivery(s)}`}
else if(phase==='approval'){body+=approval(s)}
else{body+=`<section class="failure" role="status"><strong>${s.failure}</strong><p>${s.failureText}</p></section><details class="process"><summary>${icon('chevron')}已保留的进度</summary><div class="steps"><span>${scene==='dev'?'代码修改已写入项目':'上一次成功的结果与观察可在详情检查'}</span></div></details><div class="action-row"><button class="primary" id="recover">${scene==='browser'?'重新观察':scene==='data'?'重试读取':'查看失败原因'}</button><button class="quiet" data-detail>查看详情</button></div>`}
if(scene==='browser')body+=share();body+=`<p class="followup">${phase==='complete'?s.next:phase==='approval'?'核对后再继续，当前动作尚未执行。':'已经完成的工作会保留。'}</p>`;$('content').innerHTML=body;
document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>openDetails(b)));
$('approve')?.addEventListener('click',()=>{phase='complete';render();toast('已切换到完成态演示；没有发送任何动作');$('task-title').focus()});
$('reject')?.addEventListener('click',()=>{phase='failure';render();$('content').querySelector('.failure strong').textContent='操作已拒绝';$('content').querySelector('.failure p').textContent='没有执行这一步。已有上下文保留，你可以修改目标或结束任务。';$('task-title').focus()});
$('recover')?.addEventListener('click',e=>openDetails(e.currentTarget));
}
$('stop-share').addEventListener('click',()=>{sharing=false;const pending=phase==='approval';if(pending)phase='failure';render();if(pending){$('content').querySelector('.failure strong').textContent='共享已结束';$('content').querySelector('.failure p').textContent='没有执行待确认动作。继续工作需要重新共享目标并观察。'}toast('共享已结束（演示），不会执行任何输入');$('task-title').focus()});
function openDetails(button){trigger=button;const s=scenes[scene];$('sheet-title').textContent=phase==='failure'?'当前状态与恢复':scene==='data'?'结果与来源':'验证详情';
const facts=scene==='data'?'<dt>数据源</dt><dd>示例订单库</dd><dt>一致性</dt><dd>实时重算</dd><dt>查看时间</dt><dd>10:42</dd><dt>结果范围</dt><dd>4 行 · 未截断</dd>':scene==='browser'?'<dt>目标</dt><dd>专属浏览器 · 示例客户页面</dd><dt>证据</dt><dd>保存后观察 + 动作回执</dd><dt>边界</dt><dd>仅当前共享；不复用审批</dd>':'<dt>目录</dt><dd><code>D:\\Project\\Studio</code></dd><dt>范围</dt><dd>2 个文件</dd><dt>检查</dt><dd>相关测试、类型检查与静态检查</dd>';
$('sheet-body').innerHTML=`<section class="sheet-section"><h3>${s.asset}</h3><p>以下是原型的示例信息。正式工作台应读取耐久事实与对应成果证据。</p><dl class="facts">${facts}</dl></section>${phase==='failure'?'<section class="sheet-section"><h3>安全的下一步</h3><p>先检查当前事实，再决定是否执行新的动作。读取可重试；结果未知的写入或点击不可自动重放。</p></section>':`<section class="sheet-section"><h3>${scene==='data'?'来源核对':'检查结果'}</h3>${(scene==='dev'?['空值边界检查 · 通过','类型检查 · 通过','相关静态检查 · 通过']:scene==='data'?['查询已校验，只读执行','范围与当前筛选一致','实时重算提示保留']:['操作回执已记录','保存后的页面状态已观察','观察时间与共享代次匹配']).map(t=>`<div class="check-row">${icon('check')}<span>${t}</span></div>`).join('')}</section>`}<details class="small muted"><summary>技术信息（示例）</summary><pre>Artifact: example-${scene}\nSession: example-session\n所有值均为设计演示</pre></details>`;$('inspector').showModal();$('close-sheet').focus()}
$('close-sheet').addEventListener('click',()=>$('inspector').close());$('inspector').addEventListener('close',()=>{if(trigger?.isConnected)trigger.focus()});
$('scene').addEventListener('change',e=>{scene=e.target.value;sharing=true;render();$('stream').scrollTop=0});$('phase').addEventListener('change',e=>{phase=e.target.value;render();$('stream').scrollTop=0});
$('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').querySelector('span').textContent=dark?'切换浅色':'切换深色'});
$('new-task').addEventListener('click',()=>{$('input').focus();toast('可在输入区演示新目标；此原型不会创建会话')});$('attach').addEventListener('click',()=>toast('正式应用在这里附加文件或共享电脑；原型不读取本机文件'));
$('composer').addEventListener('submit',e=>{e.preventDefault();if($('input').value.trim()){$('input').value='';toast('演示输入已清空，没有发送到引擎')}else $('input').focus()});render();
</script>
</body>
</html>
