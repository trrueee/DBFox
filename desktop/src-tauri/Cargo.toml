
[package]
name = "dbfox"
version = "1.0.3"
description = "DBFox - AI-powered Database Client"
authors = ["DBFox"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "dbfox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
regex = "1"
zip = { version = "7.2", default-features = false }
