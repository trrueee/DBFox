[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
]

[tool.pytest.ini_options]
norecursedirs = [
    ".build_venv",
    ".cache",
    ".git",
    ".tmp",
    ".venv",
    "desktop/node_modules",
    "output",
    "pyinstaller_build",
    "pyinstaller_dist",
]
markers = [
    "e2e: end-to-end tests that require a real DBFox runtime and external services",
    "engineering_contract: repository and dependency governance contracts",
    "integration: tests that require external services (real API calls, etc.)",
    "migration: metadata schema migration and repair contracts",
    "platform_contract: platform-sensitive sidecar and desktop build contracts",
    "slow: tests that take longer to run",
    "real_llm: tests that require real LLM API access (API key, etc.)",
]

