name: Windows signed Electron draft release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: windows-signed-release
  cancel-in-progress: false

env:
  NODE_VERSION: "22.18.0"
  UV_VERSION: "0.11.23"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  windows-signed-draft:
    name: Signed Electron Windows x64 draft
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: release
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Require the Windows publisher credentials
        shell: pwsh
        run: |
          foreach ($name in @('WINDOWS_CERTIFICATE_BASE64', 'WINDOWS_CERTIFICATE_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required release credential is missing: $name"
            }
          }

      - name: Require a GitHub-verified source commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $verified = gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}" `
            --jq '.commit.verification.verified'
          if ($verified -ne 'true') {
            throw 'The release source commit is not cryptographically verified by GitHub.'
          }

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .sidecar-python-version
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-dev.lock

      # v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Create the isolated frozen-runtime build environment
        shell: pwsh
        run: |
          python -m venv .build_venv
          uv pip sync --require-hashes requirements-dev.lock `
            --python ./.build_venv/Scripts/python.exe

      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and probe the unsigned frozen Sidecar
        shell: pwsh
        run: ./.build_venv/Scripts/python.exe build_sidecar.py

      - name: Import publisher identity, sign Sidecar, and bind its final hash
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'dbfox-release.pfx'
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -Password $password
          $certificate = $certificates |
            Where-Object {
              $_.HasPrivateKey -and
              ($_.EnhancedKeyUsageList.ObjectId.Value -contains '1.3.6.1.5.5.7.3.3')
            } |
            Sort-Object NotAfter -Descending |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw 'No code-signing certificate with a private key was imported.'
          }
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw 'Windows SDK signtool.exe is unavailable.' }

          & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd sha256 `
            /tr 'http://timestamp.digicert.com' /td sha256 `
            'desktop/electron-resources/sidecar/dbfox-engine.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Sidecar Authenticode signing failed.' }
          ./.build_venv/Scripts/python.exe build_sidecar.py --refresh-artifact-manifest

          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_LINK=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed NSIS installer and create an unpublished draft
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          node ./scripts/prepare-electron-package.mjs
          npx electron-builder --projectDir electron-app `
            --config ../electron-builder.yml --config.forceCodeSigning=true --publish always

      - name: Verify frozen runtime, publisher signatures, and update metadata
        shell: pwsh
        run: |
          python scripts/verify_release_artifact.py `
            --output reports/release-artifact-verification.json

          $installer = Get-ChildItem 'desktop/release-electron' -File -Filter 'DBFox-*.exe' |
            Select-Object -First 1
          $signedFiles = @(
            $installer,
            (Get-Item 'desktop/release-electron/win-unpacked/DBFox.exe'),
            (Get-Item 'desktop/release-electron/win-unpacked/resources/sidecar/dbfox-engine.exe')
          )
          foreach ($file in $signedFiles) {
            if ($null -eq $file) { throw 'A signed release executable is missing.' }
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature: $($file.FullName) ($($signature.Status))"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected signer certificate: $($file.FullName)"
            }
          }

          $metadata = Get-Content 'desktop/release-electron/latest.yml' -Raw
          foreach ($required in @('sha512:', 'files:', '.exe')) {
            if (-not $metadata.Contains($required)) {
              throw "Electron update metadata is missing: $required"
            }
          }
          $appUpdate = Get-Content `
            'desktop/release-electron/win-unpacked/resources/app-update.yml' -Raw
          if (-not $appUpdate.Contains('publisherName:')) {
            throw 'Installed update policy is not bound to the Authenticode publisher.'
          }

      - name: Run packaged host and NSIS lifecycle evidence
        working-directory: desktop
        shell: pwsh
        run: |
          npm run test:electron-packaged
          $candidate = Get-ChildItem 'release-electron' -File -Filter 'DBFox-*.exe' |
            Select-Object -First 1
          & '../scripts/verify_windows_nsis_lifecycle.ps1' `
            -CandidateInstaller $candidate.FullName `
            -ExpectedVersion ((Get-Content package.json -Raw | ConvertFrom-Json).version) `
            -Output '../reports/windows-nsis-lifecycle.json'

      # actions/attest v4.2.1
      - name: Attest official release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: |
            desktop/release-electron/DBFox-*.exe
            desktop/release-electron/DBFox-*.exe.blockmap
            desktop/release-electron/latest.yml

      # v4.6.2
      - name: Upload signed release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-signed-electron-release-${{ github.sha }}
          path: |
            reports/release-artifact-verification.json
            reports/windows-nsis-lifecycle.json
            desktop/electron-resources/sidecar/dbfox-engine-runtime-manifest.json
            desktop/release-electron/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove imported release credentials
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CSC_LINK) -and (Test-Path -LiteralPath $env:CSC_LINK)) {
            Remove-Item -LiteralPath $env:CSC_LINK -Force
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" `
              -Force -ErrorAction SilentlyContinue
          }
