name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Re-evaluate known-vulnerability feeds even when source dependencies have
  # not changed.  The offset avoids the busiest top-of-hour GitHub window.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Pull requests do not need write access.  Keep the token minimally scoped even
# on trusted branch pushes so a compromised test dependency cannot mutate the
# repository or its releases.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.8"
  NODE_VERSION: "22.18.0"
  RUST_VERSION: "1.95.0"
  UV_VERSION: "0.11.23"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.classify.outputs.full }}
      backend: ${{ steps.classify.outputs.backend }}
      python_quality: ${{ steps.classify.outputs.python_quality }}
      migration: ${{ steps.classify.outputs.migration }}
      agent_runtime: ${{ steps.classify.outputs.agent_runtime }}
      isolated_worker: ${{ steps.classify.outputs.isolated_worker }}
      sidecar: ${{ steps.classify.outputs.sidecar }}
      frontend: ${{ steps.classify.outputs.frontend }}
      rust: ${{ steps.classify.outputs.rust }}
      supply_chain: ${{ steps.classify.outputs.supply_chain }}
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Classify repository changes for fast CI routing
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/ci_changed_paths.py \
              --event-name "${{ github.event_name }}" \
              --base-ref "origin/${{ github.base_ref }}" \
              --head-ref "HEAD"
          else
            python scripts/ci_changed_paths.py \
              --event-name "${{ github.event_name }}"
          fi

  migration-and-python-quality:
    name: Migration contract and Python quality
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.python_quality == 'true' || needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-24.04
    env:
      DBFOX_MIGRATE_ONLY: "1"
    steps:
      - name: Configure runner-local paths
        run: |
          echo "DBFOX_DATABASE_URL=sqlite:///$RUNNER_TEMP/dbfox-migration-ci.db" >> "$GITHUB_ENV"
          echo "DBFOX_RUNTIME_DIR=$RUNNER_TEMP/dbfox-runtime" >> "$GITHUB_ENV"

      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock

      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Compile all Python runtime modules
        run: python -m compileall -q engine build_sidecar.py conftest.py scripts

      - name: Lint Python runtime, tests, and repository scripts
        run: python -m pyflakes engine build_sidecar.py conftest.py scripts

      - name: Type-check the complete Python runtime
        run: >-
          python -m mypy --no-warn-unused-configs --follow-imports=skip
          engine build_sidecar.py --no-incremental

      - name: Verify committed dependency lock contracts
        run: python -m pytest engine/tests/test_engineering_contracts.py -q --tb=short

      - name: Enforce Python dependency licenses and generate CycloneDX inventory
        run: python scripts/dependency_governance.py --ecosystem python --output reports/dbfox-python-sbom.cdx.json

      - name: Verify a fresh metadata database upgrades and models are migration-complete
        run: |
          rm -f "$RUNNER_TEMP/dbfox-migration-ci.db"
          python -m alembic upgrade head
          python -m alembic check
          python -m pytest \
            engine/tests/test_migrations.py \
            engine/tests/test_fts_migration_repair.py \
            engine/tests/test_db_init.py \
            -q --tb=short

  backend-core:
    name: Backend core regression
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Configure runner-local paths
        run: echo "DBFOX_RUNTIME_DIR=$RUNNER_TEMP/dbfox-runtime" >> "$GITHUB_ENV"

      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Run backend tests without external services or live LLM credentials
        run: >-
          python -m pytest engine/tests -q --tb=short
          -m "not e2e and not integration and not real_llm and not migration and not engineering_contract and not platform_contract"

  isolated-worker-platform-contract:
    name: Isolated worker contract (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.isolated_worker == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Run isolated worker transport and patch contracts
        run: >-
          python -m pytest
          engine/tests/test_tool_attempt_runner.py
          engine/tests/test_workspace_patch_tool.py
          -q --tb=short

  production-python-compatibility:
    name: Production Python compatibility regression
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Configure runner-local paths
        run: echo "DBFOX_RUNTIME_DIR=$RUNNER_TEMP/dbfox-runtime" >> "$GITHUB_ENV"

      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the pinned production-interpreter test environment
        shell: bash
        run: |
          export UV_PYTHON_CPYTHON_BUILD="$(tr -d '\r\n' < .sidecar-python-build)"
          uv venv --managed-python \
            --python "$(tr -d '\r\n' < .sidecar-python-version)" \
            .production_test_venv
          echo "PRODUCTION_TEST_PYTHON=./.production_test_venv/bin/python" >> "$GITHUB_ENV"

      - name: Install locked development dependencies for compatibility testing
        run: uv pip sync requirements-dev.lock --python "$PRODUCTION_TEST_PYTHON"

      - name: Run all deterministic backend contracts on the production interpreter
        run: >-
          "$PRODUCTION_TEST_PYTHON" -m pytest engine/tests -q --tb=short
          -m "not e2e and not integration and not real_llm"

  agent-runtime:
    name: Agent runtime regression
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.agent_runtime == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Configure runner-local paths
        run: echo "DBFOX_RUNTIME_DIR=$RUNNER_TEMP/dbfox-runtime" >> "$GITHUB_ENV"

      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Run deterministic Agent and durable-runtime tests
        run: >-
          python -m pytest engine/agent/tests -q --tb=short
          -m "not e2e and not integration and not real_llm"

  sidecar-build:
    name: Frozen sidecar build smoke
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.sidecar == 'true'
    runs-on: ubuntu-24.04
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run core contracts with the production Sidecar interpreter
        run: |
          export UV_PYTHON_CPYTHON_BUILD="$(tr -d '\r\n' < .sidecar-python-build)"
          uv venv --managed-python \
            --python "$(tr -d '\r\n' < .sidecar-python-version)" \
            .build_venv
          uv pip sync requirements-dev.lock --python ./.build_venv/bin/python
          ./.build_venv/bin/python -m pytest \
            engine/tests/test_runtime_manifest.py \
            engine/tests/test_global_error_boundary.py \
            engine/tests/test_sql_safety_service.py \
            engine/agent/tests/test_prompt_and_completion.py \
            engine/agent/tests/test_run_loop.py \
            -q --tb=short

      - name: Build and smoke the clean PyInstaller sidecar
        run: |
          ./.build_venv/bin/python build_sidecar.py
          test -x desktop/src-tauri/binaries/dbfox-engine-x86_64-unknown-linux-gnu
          SIDECAR_PYTHON=./.build_venv/bin/python node desktop/scripts/smoke-sidecar.mjs

  supply-chain-audit:
    name: Locked dependency security audit
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.supply_chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Audit only committed lockfiles.  No lifecycle scripts or dependency
      # resolver is allowed to execute while collecting vulnerability metadata.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_TERMINAL_PROMPT: "0"
      npm_config_fetch_retries: "2"
      npm_config_fetch_timeout: "30000"
    steps:
      - name: Configure runner-local paths
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download the checksum-verified OSV Scanner
        env:
          OSV_SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          OSV_SCANNER_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --connect-timeout 15 --max-time 120 \
            --output "$RUNNER_TEMP/osv-scanner" "$OSV_SCANNER_URL"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/osv-scanner"

      - name: Audit all committed Python hash locks against OSV
        run: |
          timeout 120s "$RUNNER_TEMP/osv-scanner" scan source --no-resolve --data-source=native --verbosity=warn \
            --config=osv-scanner.toml \
            --lockfile=requirements.txt:requirements.lock \
            --lockfile=requirements.txt:requirements-dev.lock \
            --lockfile=requirements.txt:requirements-build.lock

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Audit the committed frontend lockfile without installing packages
        working-directory: desktop
        run: >-
          timeout 90s npm audit --package-lock-only --ignore-scripts
          --audit-level=high --registry=https://registry.npmjs.org

      - name: Enforce frontend dependency licenses and generate CycloneDX inventory
        run: python scripts/dependency_governance.py --ecosystem node --output reports/dbfox-node-sbom.cdx.json

      - name: Download the checksum-verified Cargo advisory scanner
        env:
          CARGO_AUDIT_URL: https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-audit"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --connect-timeout 15 --max-time 120 \
            --output "$RUNNER_TEMP/cargo-audit.tgz" "$CARGO_AUDIT_URL"
          echo "$CARGO_AUDIT_SHA256  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/cargo-audit.tgz" --directory "$RUNNER_TEMP/cargo-audit" --strip-components=1

      - name: Audit the committed Cargo lockfile against RustSec
        working-directory: desktop/src-tauri
        run: |
          CARGO_AUDIT_BIN="$RUNNER_TEMP/cargo-audit/cargo-audit"
          test -x "$CARGO_AUDIT_BIN"
          timeout 120s "$CARGO_AUDIT_BIN" audit --db "$RUNNER_TEMP/rustsec-advisory-db" --file Cargo.lock --color never

  frontend:
    name: Frontend test, lint, and build
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked engine dependencies for OpenAPI export
        working-directory: ${{ github.workspace }}
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify generated API matches the FastAPI contract
        run: |
          npm run generate:api
          git diff --exit-code -- src/lib/api/generated

      - name: Run ESLint
        run: npm run lint

      - name: Type-check frontend tests
        run: npm run typecheck:test

      - name: Run frontend unit tests serially for deterministic memory usage
        run: npm test -- --maxWorkers=1

      - name: Compile and build the frontend
        run: npm run build

  rust:
    name: Rust format, lint, and test
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Linux libraries required by Tauri's Rust test build
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install the repository-pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt

      - name: Validate the committed Cargo dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Enforce Rust dependency licenses and generate CycloneDX inventory
        working-directory: .
        run: python scripts/dependency_governance.py --ecosystem rust --output reports/dbfox-rust-sbom.cdx.json

      - name: Enforce Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust unit tests with the committed lockfile
        run: cargo test --locked

  release-platform-contract:
    name: Release contract (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      DBFOX_RELEASE_TOKEN_SENTINEL: dbfox-ci-release-token-sentinel-7f596c622a1d4c6a
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .sidecar-python-version
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-dev.lock

      # v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install the repository-pinned Rust toolchain
        run: rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal

      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Create the isolated frozen-runtime build environment
        shell: bash
        run: |
          export UV_PYTHON_CPYTHON_BUILD="$(tr -d '\r\n' < .sidecar-python-build)"
          uv venv --managed-python \
            --python "$(tr -d '\r\n' < .sidecar-python-version)" \
            .build_venv
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "SIDECAR_PYTHON=./.build_venv/Scripts/python.exe" >> "$GITHUB_ENV"
            uv pip sync requirements-dev.lock --python ./.build_venv/Scripts/python.exe
          else
            echo "SIDECAR_PYTHON=./.build_venv/bin/python" >> "$GITHUB_ENV"
            uv pip sync requirements-dev.lock --python ./.build_venv/bin/python
          fi

      - name: Run core contracts with the production Sidecar interpreter
        shell: bash
        run: >-
          "$SIDECAR_PYTHON" -m pytest
          engine/tests/test_runtime_manifest.py
          engine/tests/test_global_error_boundary.py
          engine/tests/test_sql_safety_service.py
          engine/agent/tests/test_prompt_and_completion.py
          engine/agent/tests/test_run_loop.py
          -q --tb=short

      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify platform-sensitive sidecar contracts
        shell: bash
        run: >-
          "$SIDECAR_PYTHON" -m pytest engine/tests/test_build_sidecar.py -q --tb=short

      - name: Record the authoritative host tuple
        shell: bash
        run: |
          mkdir -p reports
          rustc --print host-tuple | tee reports/host-tuple.txt

      - name: Build final desktop installers and probe the frozen sidecar
        working-directory: desktop
        env:
          VITE_LOCAL_ENGINE_TOKEN: ${{ env.DBFOX_RELEASE_TOKEN_SENTINEL }}
          # linuxdeploy strips ELF files by default. A PyInstaller one-file
          # Sidecar is already finalized and hash-bound to its runtime manifest;
          # mutating it during AppImage assembly breaks that integrity contract.
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
        run: npm run tauri build

      - name: Run the authenticated frozen Sidecar smoke
        working-directory: desktop
        run: npm run test:sidecar

      - name: Extract the final installer and verify its runtime manifest
        run: >-
          python scripts/verify_release_artifact.py
          --forbidden-value-env DBFOX_RELEASE_TOKEN_SENTINEL
          --output reports/release-artifact-verification.json

      # v4.6.2
      - name: Upload the platform release-contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-contract-${{ matrix.os }}-${{ github.sha }}
          path: |
            reports/host-tuple.txt
            reports/release-artifact-verification.json
            reports/dlc-packaged-e2e-*.json
            desktop/src-tauri/binaries/dbfox-engine-runtime-manifest.json
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  ci-required:
    name: All required checks
    if: always()
    needs:
      - changes
      - migration-and-python-quality
      - backend-core
      - isolated-worker-platform-contract
      - production-python-compatibility
      - agent-runtime
      - sidecar-build
      - supply-chain-audit
      - frontend
      - rust
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required check outcomes
        shell: python
        run: |
          import sys

          results = {
              "changes": "${{ needs.changes.result }}",
              "migration-and-python-quality": "${{ needs.migration-and-python-quality.result }}",
              "backend-core": "${{ needs.backend-core.result }}",
              "isolated-worker-platform-contract": "${{ needs.isolated-worker-platform-contract.result }}",
              "production-python-compatibility": "${{ needs.production-python-compatibility.result }}",
              "agent-runtime": "${{ needs.agent-runtime.result }}",
              "sidecar-build": "${{ needs.sidecar-build.result }}",
              "supply-chain-audit": "${{ needs.supply-chain-audit.result }}",
              "frontend": "${{ needs.frontend.result }}",
              "rust": "${{ needs.rust.result }}",
          }

          expected = {
              "migration-and-python-quality": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.python_quality == 'true' || needs.changes.outputs.migration == 'true' }}",
              "backend-core": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true' }}",
              "isolated-worker-platform-contract": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.isolated_worker == 'true' }}",
              "production-python-compatibility": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true' }}",
              "agent-runtime": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.agent_runtime == 'true' }}",
              "sidecar-build": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.sidecar == 'true' }}",
              "supply-chain-audit": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.supply_chain == 'true' }}",
              "frontend": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.frontend == 'true' }}",
              "rust": "${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.rust == 'true' }}",
          }

          print("--- CI JOB RESULTS ---")
          for k, v in results.items():
              print(f"  {k}: result={v}, expected={expected.get(k, 'N/A')}")

          if results["changes"] != "success":
              print(f"FAILED: 'changes' job did not succeed: {results['changes']}")
              sys.exit(1)

          failed = False
          for job, res in results.items():
              if job == "changes":
                  continue
              is_expected = expected.get(job) == "true"
              if is_expected:
                  if res != "success":
                      print(f"FAILED: Expected job '{job}' had result '{res}', expected 'success'")
                      failed = True
                  else:
                      print(f"OK: Expected job '{job}' passed with success")
              else:
                  if res not in ("skipped", "success"):
                      print(f"FAILED: Unselected job '{job}' had unexpected result '{res}'")
                      failed = True
                  else:
                      print(f"OK: Unselected job '{job}' was safely skipped (or succeeded): {res}")

          if failed:
              sys.exit(1)
          print("ALL REQUIRED CI CHECKS COMPLETED SUCCESSFULLY.")
